{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Login</h2>

    <form method="POST">

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button
            type="button"
            id="togglePasswordButton"
            onclick="togglePassword()"
        >
            Show Password
        </button>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</div>

<script>
function togglePassword() {
    const pw = document.getElementById("password");
    const button = document.getElementById("togglePasswordButton");

    if (pw.type === "password") {
        pw.type = "text";
        button.textContent = "Hide Password";
    } else {
        pw.type = "password";
        button.textContent = "Show Password";
    }
}

// Prevent spaces in username and password
const noSpaces = ["username", "password"];

noSpaces.forEach(id => {
    const input = document.getElementById(id);

    input.addEventListener("input", () => {
        input.value = input.value.replace(/\s/g, "");
    });
});
</script>

{% endblock %}
