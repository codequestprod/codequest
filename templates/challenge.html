{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>{{ challenge.title }}</h1>

    <span class="difficulty-badge">
        {{ challenge.difficulty }}
    </span>

    <p>{{ challenge.description }}</p>

    <div class="reward-row">
        <span>⭐ {{ challenge.xp_reward }} XP</span>
        <span>🪙 {{ challenge.coin_reward }} Coins</span>
    </div>

    <div class="code-shell">

    <textarea
        class="code-editor"
        placeholder="Write your Python code here..."
        spellcheck="false"
        data-grammarly="false"
        data-enable-grammarly="false"
    ></textarea>

    <button class="run-btn" type="button" onclick="runCode()">
        ▶ Run Code
    </button>

    <div class="code-output" id="codeOutput">
        <div class="output-title">OUTPUT</div>
        <pre id="outputText">Output will appear here...</pre>
    </div>

</div>

</div>

<script>
async function runCode() {

    const code = document.querySelector(".code-editor").value;
    const output = document.querySelector("#outputText");

    output.textContent = "Running...";

    const response = await fetch("/run-code", {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            code: code
        })
    });

    const data = await response.json();

    output.textContent = data.output;
}
</script>

{% endblock %}
