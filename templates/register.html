{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Create Account</h2>

    <form method="POST">

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <p
            id="passwordHint"
            style="color:red; font-size:14px; margin-top:5px; visibility:hidden;"
        >
            Password must be at least 8 characters
        </p>

        <br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <p
            id="passwordMatchHint"
            style="color:red; font-size:14px; margin-top:5px; display:none;"
        >
            Passwords do not match
        </p>

        <br><br>

        <button
            type="button"
            id="togglePasswordButton"
            onclick="togglePassword()"
        >
            Show Password
        </button>

        <br><br>

        <button
            type="submit"
            id="createAccountButton"
            disabled
        >
            Create Account
        </button>

    </form>

</div>


<script>

// ======================
// SHOW / HIDE PASSWORD
// ======================

function togglePassword() {

    const pw = document.getElementById("password");
    const cpw = document.getElementById("confirm_password");
    const button = document.getElementById("togglePasswordButton");

    if (pw.type === "password") {

        pw.type = "text";
        cpw.type = "text";
        button.textContent = "Hide Password";

    } else {

        pw.type = "password";
        cpw.type = "password";
        button.textContent = "Show Password";

    }

}


// ======================
// PREVENT SPACES
// ======================

const noSpaces = [
    "username",
    "email",
    "password",
    "confirm_password"
];

noSpaces.forEach(id => {

    const input = document.getElementById(id);

    input.addEventListener("input", () => {

        input.value = input.value.replace(/\s/g, "");

    });

});


// ======================
// PASSWORD VALIDATION
// ======================

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm_password");

const passwordHint = document.getElementById("passwordHint");
const passwordMatchHint = document.getElementById("passwordMatchHint");
const createButton = document.getElementById("createAccountButton");


password.addEventListener("focus", () => {

    if (password.value.length < 8) {
        passwordHint.style.visibility = "visible";
    }

});


password.addEventListener("input", () => {

    updateForm();

    if (password.value.length >= 8) {

        passwordHint.style.visibility = "hidden";

    } else {

        passwordHint.style.visibility = "visible";

    }


    if (confirmPassword.value.length > 0) {
        checkPasswordMatch();
    }

});


confirmPassword.addEventListener("input", updateForm);


confirmPassword.addEventListener("blur", checkPasswordMatch);


function updateForm() {

    const passwordValid = password.value.length >= 8;

    const passwordsMatch =
        password.value === confirmPassword.value &&
        confirmPassword.value.length > 0;


    createButton.disabled = !(passwordValid && passwordsMatch);

}


function checkPasswordMatch() {

    if (
        confirmPassword.value.length > 0 &&
        password.value !== confirmPassword.value
    ) {

        passwordMatchHint.style.display = "block";

    } else {

        passwordMatchHint.style.display = "none";

    }

}

</script>


{% endblock %}
