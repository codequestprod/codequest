{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Create Account</h2>

    <form method="POST">

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <br><br>

        <button
            type="button"
            id="togglePasswordButton"
            onclick="togglePassword()"
        >
            Show Password
        </button>

        <br><br>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

<script>
function togglePassword() {
    const pw = document.getElementById("password");
    const cpw = document.getElementById("confirm_password");
    const button = document.getElementById("togglePasswordButton");

    const showing = pw.type === "text";

    if (showing) {
        pw.type = "password";
        cpw.type = "password";
        button.textContent = "Show Password";
    } else {
        pw.type = "text";
        cpw.type = "text";
        button.textContent = "Hide Password";
    }
}

// Prevent spaces in all fields
const noSpaces = ["username", "email", "password", "confirm_password"];

noSpaces.forEach(id => {
    const input = document.getElementById(id);

    input.addEventListener("input", () => {
        input.value = input.value.replace(/\s/g, "");
    });
});
</script>

{% endblock %}
