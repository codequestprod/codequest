{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Create Account</h2>

    <form method="POST">

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >

        <p
            id="usernameHint"
            style="color:red; font-size:14px; margin:2px 0 8px 0; visibility:hidden;"
        >
            Username already exists
        </p>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <p
            id="emailHint"
            style="color:red; font-size:14px; margin:2px 0 8px 0; visibility:hidden;"
        >
            Email already exists
        </p>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <p
            id="passwordHint"
            style="color:red; font-size:14px; margin:2px 0 0 0; visibility:hidden;"
        >
            Password must be at least 8 characters
        </p>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <p
            id="passwordMatchHint"
            style="color:red; font-size:14px; margin:2px 0 4px 0; visibility:hidden;"
        >
            Passwords do not match
        </p>

        <button
            type="button"
            id="togglePasswordButton"
            onclick="togglePassword()"
        >
            Show Password
        </button>

        <br><br>

        <button
            type="submit"
            id="createAccountButton"
            disabled
        >
            Create Account
        </button>

    </form>

</div>

<script>

// ======================
// SHOW / HIDE PASSWORD
// ======================

function togglePassword() {

    const pw = document.getElementById("password");
    const cpw = document.getElementById("confirm_password");
    const button = document.getElementById("togglePasswordButton");

    if (pw.type === "password") {

        pw.type = "text";
        cpw.type = "text";
        button.textContent = "Hide Password";

    } else {

        pw.type = "password";
        cpw.type = "password";
        button.textContent = "Show Password";

    }

}


// ======================
// PREVENT SPACES
// ======================

const noSpaces = [
    "username",
    "email",
    "password",
    "confirm_password"
];

noSpaces.forEach(id => {

    const input = document.getElementById(id);

    input.addEventListener("input", () => {

        input.value = input.value.replace(/\s/g, "");

    });

});


// ======================
// PASSWORD VALIDATION
// ======================

const username = document.getElementById("username");
const email = document.getElementById("email");

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm_password");

const usernameHint = document.getElementById("usernameHint");
const emailHint = document.getElementById("emailHint");

const passwordHint = document.getElementById("passwordHint");
const passwordMatchHint = document.getElementById("passwordMatchHint");

const createButton = document.getElementById("createAccountButton");

let usernameAvailable = false;
let emailAvailable = false;

username.addEventListener("blur", checkUsername);
email.addEventListener("blur", checkEmail);


password.addEventListener("focus", () => {

    if (password.value.length < 8) {
        passwordHint.style.visibility = "visible";
    }

});


password.addEventListener("input", () => {

    updateForm();

    if (password.value.length >= 8) {

        passwordHint.style.visibility = "hidden";

    } else {

        passwordHint.style.visibility = "visible";

    }

    if (confirmPassword.value.length > 0) {
        checkPasswordMatch();
    }

});


confirmPassword.addEventListener("input", () => {

    updateForm();

    if (confirmPassword.value.length > 0) {
        checkPasswordMatch();
    }

});


confirmPassword.addEventListener("blur", checkPasswordMatch);


function updateForm() {

    const passwordValid = password.value.length >= 8;

    const passwordsMatch =
        password.value === confirmPassword.value &&
        confirmPassword.value.length > 0;

    createButton.disabled = !(
        passwordValid &&
        passwordsMatch &&
        usernameAvailable &&
        emailAvailable
    );

}


function checkPasswordMatch() {

    if (
        confirmPassword.value.length > 0 &&
        password.value !== confirmPassword.value
    ) {

        passwordMatchHint.style.visibility = "visible";

    } else {

        passwordMatchHint.style.visibility = "hidden";

    }

}

async function checkUsername() {

    if (username.value.length === 0) {
        usernameHint.style.visibility = "hidden";
        usernameAvailable = false;
        updateForm();
        return;
    }

    const response = await fetch(
        `/check-register?username=${encodeURIComponent(username.value)}`
    );

    const data = await response.json();

    if (data.username_exists) {

        usernameHint.style.visibility = "visible";
        usernameAvailable = false;

    } else {

        usernameHint.style.visibility = "hidden";
        usernameAvailable = true;

    }

    updateForm();

}


async function checkEmail() {

    if (email.value.length === 0) {
        emailHint.style.visibility = "hidden";
        emailAvailable = false;
        updateForm();
        return;
    }

    const response = await fetch(
        `/check-register?email=${encodeURIComponent(email.value)}`
    );

    const data = await response.json();

    if (data.email_exists) {

        emailHint.style.visibility = "visible";
        emailAvailable = false;

    } else {

        emailHint.style.visibility = "hidden";
        emailAvailable = true;

    }

    updateForm();

}

</script>

{% endblock %}
