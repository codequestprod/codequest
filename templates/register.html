{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Create Account</h2>

    <form method="POST">

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
        >

        <br>

        <div id="passwordRequirements">

            <strong>Password Requirements</strong>

            <p id="lengthCheck">✗ At least 8 characters</p>
            <p id="letterCheck">✗ Contains a letter</p>
            <p id="numberCheck">✗ Contains a number</p>
            <p id="matchCheck">✗ Passwords match</p>

        </div>

        <br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <br><br>

        <button
            type="button"
            id="togglePasswordButton"
            onclick="togglePassword()"
        >
            Show Password
        </button>

        <br><br>

        <button
            type="submit"
            id="createAccountButton"
            disabled
        >
            Create Account
        </button>

    </form>

</div>


<script>

// Show / Hide Password

function togglePassword() {

    const pw = document.getElementById("password");
    const cpw = document.getElementById("confirm_password");
    const button = document.getElementById("togglePasswordButton");

    if (pw.type === "password") {

        pw.type = "text";
        cpw.type = "text";
        button.textContent = "Hide Password";

    } else {

        pw.type = "password";
        cpw.type = "password";
        button.textContent = "Show Password";

    }
}


// Prevent spaces

const noSpaces = [
    "username",
    "email",
    "password",
    "confirm_password"
];

noSpaces.forEach(id => {

    const input = document.getElementById(id);

    input.addEventListener("input", () => {

        input.value = input.value.replace(/\s/g, "");

    });

});


// Password validation

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm_password");

password.addEventListener("input", validatePassword);
confirmPassword.addEventListener("input", validatePassword);


function validatePassword() {

    const pw = password.value;
    const cpw = confirmPassword.value;

    const length = pw.length >= 8;
    const letter = /[A-Za-z]/.test(pw);
    const number = /\d/.test(pw);
    const match = pw === cpw && cpw.length > 0;


    updateRequirement(
        "lengthCheck",
        length,
        "At least 8 characters"
    );

    updateRequirement(
        "letterCheck",
        letter,
        "Contains a letter"
    );

    updateRequirement(
        "numberCheck",
        number,
        "Contains a number"
    );

    updateRequirement(
        "matchCheck",
        match,
        "Passwords match"
    );


    const valid =
        length &&
        letter &&
        number &&
        match;


    document.getElementById("createAccountButton").disabled = !valid;


    const requirements = document.getElementById("passwordRequirements");

    if (valid) {
        requirements.style.display = "none";
    } else {
        requirements.style.display = "block";
    }

}


function updateRequirement(id, passed, text) {

    const element = document.getElementById(id);

    if (passed) {

        element.style.color = "green";
        element.textContent = "✓ " + text;

    } else {

        element.style.color = "red";
        element.textContent = "✗ " + text;

    }

}


// Hide requirements initially

document.getElementById("passwordRequirements").style.display = "none";


</script>


{% endblock %}
